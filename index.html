<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>messimers.net</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --rule: #e2e2dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --fg: #ecece8;
      --muted: #8a8a83;
      --rule: #2c2c28;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 26rem; width: 100%; }
  h1 {
    margin: 0 0 1rem;
    font-size: 1.125rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 0 0 1rem;
  }
  p {
    margin: 0;
    color: var(--muted);
    font-size: 0.9375rem;
  }
</style>
</head>
<body>
  <main>
    <h1>messimers.net</h1>
    <hr>
    <p>This domain is not currently serving a public site.</p>
